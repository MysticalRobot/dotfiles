[general]
import = [
    "~/.config/alacritty/themes/themes/everforest_dark.toml"
]

[env]
term = "xterm-256color"

[window]
decorations = "None" # "Full" | "None" 
padding = { x = 6, y = 6 }
dynamic_padding = true
# opacity = 0.875
# blur = true

[font]
normal.family = "JetBrainsMono Nerd Font"
size = 11

[mouse]
hide_when_typing = true
